# Atuin — shell history in SQLite with fuzzy full-screen search (Ctrl-R).
# Docs: https://docs.atuin.sh/configuration/config/
# Sync with atuin's server is OFF: history stays on this machine.

auto_sync = false
update_check = false

search_mode = "fuzzy"
filter_mode = "global"              # Ctrl-R in the search UI cycles: global → host → session → directory
workspaces = true                   # in a git repo, "workspace" filter = commands run in that repo
style = "compact"
inline_height = 25
show_preview = true
show_help = true
enter_accept = false                # Enter puts the command on the line to edit; Tab too
keymap_mode = "emacs"

# Don't store obviously secret commands.
secrets_filter = true
history_filter = [
  "^export .*(TOKEN|SECRET|PASSWORD|KEY)=",
  "^vault (login|write)",
]

[stats]
common_subcommands = ["git", "docker", "kubectl", "brew", "npm", "cargo", "go", "claude"]
