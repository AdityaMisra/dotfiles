# Starship prompt. Colours use ANSI names (red/green/blue/...) so they follow
# whichever iTerm theme is active — switch with `theme`.
#
#  ~/D/projects/dotfiles   master !2 ?1   v3.12 (venv)                   took 4s  14:02
#  ❯
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$java\
$golang\
$rust\
$docker_context\
$kubernetes\
$aws\
$fill\
$status\
$cmd_duration\
$jobs\
$time\
$line_break\
$character"""

[directory]
style = "bold blue"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
fish_style_pwd_dir_length = 1   # ~/D/projects/dotfiles
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "≡${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold red"

[python]
symbol = " "
style = "yellow"
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "cyan"
format = "[$symbol$context( \\($namespace\\))]($style) "
# Only show inside k8s-ish projects; remove detect_* lines to always show.
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml", "helmfile.yaml"]
detect_folders = ["k8s", "kubernetes", "helm", "charts"]

[aws]
symbol = " "
style = "yellow"
format = '[$symbol($profile)(\($region\))]($style) '

[fill]
symbol = " "

[status]
disabled = false
symbol = "✘ "
style = "red"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ $duration]($style) "

[jobs]
symbol = " "
style = "blue"

[time]
disabled = false
style = "bright-black"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
